kind = "web"
previewPath = "/"
title = "AgroScan IA"
description = "Aplicación web en español para identificar enfermedades y plagas de plantas a partir de fotografías, con resultados orientativos y referencias visuales."
version = "1.0.0"
id = "artifacts/agroscan-ia"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20723

[services.development]
run = "pnpm --filter @workspace/agroscan-ia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agroscan-ia", "run", "build" ]
serve = "static"
publicDir = "artifacts/agroscan-ia/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20723"
BASE_PATH = "/"
